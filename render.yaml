# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: engineering-lab-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: engineering-lab-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: API_PUBLIC_URL
        value: https://engineering-lab-api.onrender.com
      # Set these two to your real Vercel domain(s) (comma-separated origins allowed in WEB_ORIGIN)
      - key: WEB_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: STORAGE_DRIVER
        value: local   # uploads are lost on redeploy; use cloudinary for real images
databases:
  - name: engineering-lab-db
    plan: free
