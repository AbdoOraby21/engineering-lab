name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: engineering_lab_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @engineering-lab/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @engineering-lab/api test
      - run: pnpm --filter @engineering-lab/web test

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrate first, then roll out the new API code.
      - name: Run Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @engineering-lab/api prisma:deploy
          else
            echo "::warning::DATABASE_URL_PROD is not set - skipping migrations"
          fi

      # Deploy to Render via deploy hook (set RENDER_DEPLOY_HOOK in secrets)
      - name: Deploy API to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "::warning::RENDER_DEPLOY_HOOK is not set - skipping Render deploy"
          fi

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      # Vercel auto-deploys on push to main via the GitHub Integration.
      - name: Vercel deployment
        run: |
          echo "Vercel auto-deploys on push to main (via GitHub Integration)."
          echo "Ensure the Vercel project is connected to this GitHub repo."

  post-deploy-smoke:
    needs: deploy-web
    runs-on: ubuntu-latest
    env:
      # Optional repository variables (Settings > Secrets and variables > Actions > Variables).
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - name: Wait for deploy propagation
        run: sleep 60

      - name: Smoke test API /health and /ready
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::API_URL variable is not set - skipping API smoke tests"
            exit 0
          fi
          check() {
            url="$1"
            for i in 1 2 3 4 5 6; do
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "0")
              if [ "$status" = "200" ]; then
                echo "OK $url"
                return 0
              fi
              echo "Attempt $i: $url returned $status"
              sleep 15
            done
            echo "::error::$url did not return 200"
            return 1
          }
          check "$API_URL/api/v1/health"
          check "$API_URL/api/v1/ready"

      - name: Smoke test web (home and catalog)
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::warning::WEB_URL variable is not set - skipping web smoke tests"
            exit 0
          fi
          for path in "/" "/catalog"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL$path" || echo "0")
            if [ "$status" != "200" ]; then
              echo "::error::$WEB_URL$path returned $status"
              exit 1
            fi
            echo "OK $WEB_URL$path"
          done
