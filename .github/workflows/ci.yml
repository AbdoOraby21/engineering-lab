
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  TURBO: false
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @engineering-lab/api prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Security audit
        run: pnpm audit

  api-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: engineering_lab_test
        ports: ["5432:5432"]
        options: >-
          --health-pg
          --health-cmd "pg_isready -U postgres"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @engineering-lab/api prisma:generate

      - name: Configure test database
        run: |
          psql -U postgres -c "DROP DATABASE IF EXISTS engineering_lab_test;" psql -U postgres -c "CREATE DATABASE engineering_lab_test;"

      - name: Run API tests
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/engineering_lab_test?schema=public
        run: pnpm --filter @engineering-lab/api test

  web-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Web tests
        run: pnpm --filter @engineering-lab/web test

  build:
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @engineering-lab/api prisma:generate

      - name: Build
        run: pnpm build
