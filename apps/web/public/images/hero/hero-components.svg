<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 0 2400 1000" role="img" aria-label="Electronics components composition">
  <defs>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#22C55E"/><stop offset="100%" stop-color="#16A34A"/></linearGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(34,197,94,0.35)"/><stop offset="100%" stop-color="rgba(34,197,94,0)"/></radialGradient>
  </defs>
  <rect width="2400" height="1000" fill="transparent"/>
  <!-- Arduino UNO style board (large, rotated slightly) -->
  <g transform="translate(420,300) rotate(-6)">
    <rect x="0" y="0" width="560" height="300" rx="16" fill="#10151B" stroke="#1C232B" stroke-width="3"/>
    <rect x="40" y="40" width="120" height="20" fill="#1A2027"/>
    <rect x="180" y="40" width="60" height="20" fill="#1A2027"/>
    <rect x="260" y="40" width="120" height="100" fill="#1A2027" rx="6"/>
    <rect x="400" y="40" width="100" height="16" fill="#22C55E"/>
    <circle cx="480" cy="220" r="14" fill="#22C55E"/>
    <circle cx="480" cy="220" r="6" fill="#04130A"/>
    <!-- USB -->
    <rect x="500" y="240" width="34" height="14" fill="#1A2027" stroke="#22C55E" stroke-width="2"/>
    <!-- power jack -->
    <rect x="540" y="240" width="20" height="12" fill="#10151B" stroke="#1C232B"/>
  </g>
  <!-- Raspberry Pi board -->
  <g transform="translate(1120,320) rotate(4)">
    <rect x="0" y="0" width="420" height="260" rx="14" fill="#10151B" stroke="#1C232B" stroke-width="3"/>
    <rect x="20" y="20" width="140" height="16" fill="#1A2027"/>
    <rect x="180" y="20" width="90" height="12" fill="#1A2027"/>
    <rect x="290" y="20" width="110" height="80" fill="#1A2027" rx="6"/>
    <rect x="20" y="200" width="60" height="14" fill="#22C55E"/>
    <rect x="100" y="200" width="40" height="14" fill="#1A2027"/>
    <rect x="160" y="200" width="40" height="14" fill="#22C55E"/>
  </g>
  <!-- HC-SR04 sensor -->
  <g transform="translate(1380,240) rotate(12)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="#10151B" stroke="#1C232B" stroke-width="3"/>
    <circle cx="40" cy="40" r="14" fill="#1A2027" stroke="#22C55E" stroke-width="2"/>
    <circle cx="80" cy="40" r="14" fill="#1A2027" stroke="#22C55E" stroke-width="2"/>
  </g>
  <!-- ESP32 dev board -->
  <g transform="translate(1560,340) rotate(-4)">
    <rect x="0" y="0" width="260" height="100" rx="8" fill="#10151B" stroke="#1C232B" stroke-width="3"/>
    <rect x="20" y="20" width="100" height="14" fill="#1A2027"/>
    <rect x="140" y="20" width="100" height="14" fill="#1A2027"/>
    <rect x="20" y="60" width="220" height="8" fill="#1A2027"/>
  </g>
  <!-- SG90 servo (blue) -->
  <g transform="translate(1700,460)">
    <rect x="0" y="0" width="90" height="50" rx="6" fill="#2563EB" stroke="#1C232B" stroke-width="3"/>
    <rect x="20" y="10" width="50" height="6" fill="#10151B"/>
    <rect x="70" y="28" width="14" height="16" fill="#1A2027" stroke="#1C232B"/>
  </g>
  <!-- LEDs (red, green, yellow) -->
  <g transform="translate(420,640)">
    <circle cx="0" cy="0" r="14" fill="#EF4444" stroke="#10151B" stroke-width="2"/><rect x="-2" y="-8" width="4" height="22" fill="#10151B"/>
    <circle cx="36" cy="0" r="14" fill="#22C55E" stroke="#10151B" stroke-width="2"/><rect x="34" y="-8" width="4" height="22" fill="#10151B"/>
    <circle cx="72" cy="0" r="14" fill="#EAB308" stroke="#10151B" stroke-width="2"/><rect x="70" y="-8" width="4" height="22" fill="#10151B"/>
  </g>
  <!-- Resistors -->
  <g transform="translate(540,650)">
    <rect x="0" y="12" width="14" height="8" fill="#1A2027"/><rect x="14" y="6" width="32" height="20" fill="#10151B" rx="4"/><rect x="46" y="12" width="14" height="8" fill="#1A2027"/>
    <rect x="60" y="12" width="14" height="8" fill="#1A2027"/><rect x="74" y="6" width="32" height="20" fill="#10151B" rx="4"/><rect x="106" y="12" width="14" height="8" fill="#1A2027"/>
  </g>
  <!-- Breadboard with jumper wires -->
  <g transform="translate(700,620)">
    <rect x="0" y="0" width="300" height="160" rx="8" fill="#F5F7FA" stroke="#1C232B" stroke-width="3"/>
    <path d="M40,60 Q100,20 160,60" fill="none" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>
    <path d="M60,120 Q120,160 180,120" fill="none" stroke="#22C55E" stroke-width="6" stroke-linecap="round"/>
    <path d="M140,80 Q200,40 260,80" fill="none" stroke="#EAB308" stroke-width="6" stroke-linecap="round"/>
    <circle cx="40" cy="60" r="5" fill="#EF4444"/><circle cx="160" cy="60" r="5" fill="#EF4444"/>
    <circle cx="60" cy="120" r="5" fill="#22C55E"/><circle cx="180" cy="120" r="5" fill="#22C55E"/>
    <circle cx="140" cy="80" r="5" fill="#EAB308"/><circle cx="260" cy="80" r="5" fill="#EAB308"/>
  </g>
  <!-- rim light / glow -->
  <ellipse cx="300" cy="800" rx="700" ry="300" fill="url(#g2)"/>
</svg>
