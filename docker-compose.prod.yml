services:
  postgres:
    image: postgres:16-alpine
    container_name: engineering-lab-db-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: engineering_lab
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d engineering_lab']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: engineering-lab-redis-prod
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: engineering-lab-api-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/engineering_lab?schema=public
      PORT: 4000
      API_PUBLIC_URL: http://localhost:4000
      # The following should be overridden at runtime with your managed provider secrets
      WEB_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET:_change_me_production
      REFRESH_TOKEN_TTL_DAYS: 7
      COOKIE_SECURE: 'true'
      COOKIE_SAME_SITE: 'lax'
      RATE_LIMIT_MAX: 300
      AUTH_RATE_LIMIT_MAX: 20
      STORAGE_DRIVER: local
      UPLOAD_DIR: uploads
      CLOUDINARY_CLOUD_NAME: ''
      CLOUDINARY_API_KEY: ''
      CLOUDINARY_API_SECRET: ''
      GOOGLE_OAUTH_ENABLED: 'false'
      GOOGLE_CLIENT_ID: ''
      GOOGLE_CLIENT_SECRET: ''
      GOOGLE_CALLBACK_URL: http://localhost:4000/api/v1/auth/google/callback
      WHATSAPP_ACCESS_TOKEN: ''
      WHATSAPP_PHONE_NUMBER_ID: ''
      DATASHEET_MAX_BYTES: 15728640
      REVIEWS_REQUIRE_PURCHASE: 'true'
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: engineering-lab-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:4000/api/v1
      VITE_APP_NAME: Engineering Lab
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: engineering-lab-nginx-prod
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - api
      - web

  caddy:
    image: caddy:2-alpine
    container_name: engineering-lab-caddy-prod
    restart: unless-stopped
    ports:
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - uploads:/data:ro
    environment:
      - CADDODATA=/data
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  uploads: